[package]
name = "worktree-gc"
version = "0.1.0"
edition = "2021"
description = "Automatically clean up git worktrees whose pull requests have been merged"
license = "MIT"
repository = "https://github.com/yuto-ts/worktree-gc"
readme = "README.md"
keywords = ["git", "worktree", "cleanup", "github", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
dirs = "6"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
